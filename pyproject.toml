[project]
name = "rsf"
version = "0.1.0"
description = "Benchmark dự báo doanh thu/COGS theo ngày (paper NCKH)"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
